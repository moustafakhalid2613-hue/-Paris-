name: Build Flutter APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get
      working-directory: paris_salon

    - name: Build APK
      run: flutter build apk --release
      working-directory: paris_salon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: paris_salon/build/app/outputs/flutter-apk/app-release.apk
