name: Build and Release Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Run pub get
        run: flutter pub get
        working-directory: paris_salon

      - name: Build APK
        run: flutter build apk --release
        working-directory: paris_salon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: paris_salon/build/app/outputs/flutter-apk/app-release.apk
