name: paris_salon
description: "نظام إدارة صالون Paris - حجوزات، مبيعات، مخزون، عمولات، تقارير"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1

  # UI / Theme
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  animated_text_kit: ^4.2.2
  lottie: ^3.1.3

  # Local Storage / Preferences
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Forms & Validation
  form_field_validator: ^1.1.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0

  # Printing / PDF / QR
  pdf: ^3.10.8
  printing: ^5.13.3
  esc_pos_utils_plus: ^2.0.1
  esc_pos_bluetooth: ^0.4.1
  blue_thermal_printer: ^1.2.3
  usb_serial: ^0.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Excel / PDF Export
  excel: ^4.0.6
  share_plus: ^10.0.2
  open_file: ^3.5.7

  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  url_launcher: ^6.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  logger: ^2.4.0
  equatable: ^2.0.5
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

dependency_overrides:
  rxdart: 0.27.7
